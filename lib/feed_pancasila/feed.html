<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;position:relative;overflow:hidden}
.top{height:300px;background:linear-gradient(160deg,#c8202c,#8a1119);color:#fff;text-align:center;padding-top:34px}

.chips span{background:#8a1119;color:#fff;font-size:24px;font-weight:700;padding:6px 20px;border-radius:30px}
